    <style>
      /* Completely suppress and hide Google Translate top banner/bar */
      .goog-te-banner-frame,
      .goog-te-banner-frame.skiptranslate,
      iframe.goog-te-banner-frame,
      iframe.skiptranslate,
      iframe[class*="goog-te-banner"],
      .VIpgJd-ZVi9od-OR9Gae-OEVmcd,
      .VIpgJd-ZVi9od-aZ2wEe-wOHMyf,
      .VIpgJd-ZVi9od-aZ2wEe-OiiCO,
      #goog-gt-tt,
      .goog-te-balloon-frame {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        height: 0 !important;
        width: 0 !important;
        position: absolute !important;
        top: -9999px !important;
        left: -9999px !important;
        z-index: -9999 !important;
      }
      body {
        top: 0px !important;
        position: static !important;
        transform: none !important;
      }
      .goog-text-highlight {
        background: none !important;
        box-shadow: none !important;
      }
    </style>

  <body>
    <div id="root"></div>
    
    <!-- Google Translate Element Container (Hidden, controlled by Custom UI) -->
    <div id="google_translate_element" style="display:none"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'hi',
            includedLanguages: 'hi,en,mai',
            autoDisplay: false,
            layout: window.google.translate.TranslateElement.InlineLayout.SIMPLE
          }, 'google_translate_element');
        }
      }

      // Continuous watchdog to prevent Google Translate from shifting body or displaying banner
      (function() {
        const removeBanner = function() {
          if (document.body && document.body.style.top && document.body.style.top !== '0px') {
            document.body.style.top = '0px';
          }
          const banner = document.querySelector('.goog-te-banner-frame, iframe.skiptranslate, .VIpgJd-ZVi9od-OR9Gae-OEVmcd');
          if (banner) {
            banner.style.display = 'none';
            banner.style.visibility = 'hidden';
            banner.style.height = '0px';
          }
        };
        setInterval(removeBanner, 200);
        window.addEventListener('load', removeBanner);
      })();
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
